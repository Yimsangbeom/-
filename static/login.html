<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCR 자동 채점 - 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f5f9;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:#1e293b}
.card{background:#fff;padding:32px;border-radius:12px;box-shadow:0 1px 4px #0002;width:330px;border:1px solid #e2e8f0}
h1{font-size:18px;margin:0 0 4px;color:#1e3a8a} p{font-size:12px;color:#64748b;margin:0 0 18px;line-height:1.5}
input,button{font-family:inherit}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;margin-bottom:10px}
button{width:100%;padding:11px;background:#1d4ed8;color:#fff;border:0;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}
#msg{color:#dc2626;font-size:13px;min-height:18px;margin-bottom:8px}
.hide{display:none}
</style></head><body>
<div class="card"><h1>📋 OCR 자동 채점 프로그램</h1>
<p id="desc">확인 중...</p>

<form id="loginForm" class="hide">
  <input id="u" placeholder="아이디" autocomplete="username" autofocus>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button type="submit">로그인</button>
</form>

<form id="setupForm" class="hide">
  <input id="su" value="hancom" placeholder="아이디" autocomplete="username">
  <input id="n1" type="password" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password">
  <input id="n2" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password">
  <button type="submit">비밀번호 설정</button>
</form>
<div id="msg"></div></div>
<script>
const $ = id => document.getElementById(id), msg = t => $('msg').innerText = t || '';
async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  return r.json();
}
(async () => {
  const s = await (await fetch('/api/auth/status')).json();
  if (s.logged_in) { location.href = '/'; return; }
  if (s.configured) { $('desc').innerText = '아이디와 비밀번호를 입력하세요.'; $('loginForm').classList.remove('hide'); }
  else if (s.setup_allowed) { $('desc').innerText = '최초 설정입니다. 사용할 비밀번호를 정해 주세요. (아이디 기본값: hancom, 원하면 바꿀 수 있습니다)'; $('setupForm').classList.remove('hide'); }
  else { $('desc').innerText = '비밀번호가 아직 설정되지 않았습니다. 서버 PC 에서 http://127.0.0.1:5000 으로 접속해 먼저 설정해 주세요.'; }
})();
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const d = await post('/api/login', {username: $('u').value.trim(), password: $('pw').value});
  if (d.status === 'success') location.href = '/'; else msg(d.message);
};
$('setupForm').onsubmit = async e => {
  e.preventDefault();
  if ($('n1').value !== $('n2').value) return msg('두 비밀번호가 다릅니다.');
  const d = await post('/api/setup', {username: $('su').value.trim(), password: $('n1').value});
  if (d.status === 'success') location.href = '/'; else msg(d.message);
};
</script></body></html>

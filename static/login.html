<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCR 자동 채점 - 로그인</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f5f9;font-family:'Malgun Gothic',sans-serif;color:#1e293b}
form{background:#fff;padding:32px;border-radius:12px;box-shadow:0 1px 4px #0002;width:320px;border:1px solid #e2e8f0}
h1{font-size:18px;margin:0 0 4px;color:#1e3a8a} p{font-size:12px;color:#64748b;margin:0 0 20px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;margin-bottom:12px}
button{width:100%;padding:11px;background:#1d4ed8;color:#fff;border:0;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}
#msg{color:#dc2626;font-size:13px;min-height:18px;margin-bottom:8px}
</style></head><body>
<form id="f"><h1>📋 OCR 자동 채점 프로그램</h1><p>접속 비밀번호를 입력하세요.</p>
<input id="pw" type="password" placeholder="비밀번호" autofocus autocomplete="current-password">
<div id="msg"></div><button type="submit">로그인</button></form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: document.getElementById('pw').value})});
  const d = await r.json();
  if (d.status === 'success') location.href = '/'; else document.getElementById('msg').innerText = d.message;
};
</script></body></html>
